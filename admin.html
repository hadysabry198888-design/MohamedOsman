<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم — مكتبة ومطبعة محمد عثمان</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>
:root{--blue:#164496;--deep:#102e67;--orange:#f47b20;--green:#78bd3d;--bg:#f4f7fb;--ink:#1c3154;--muted:#718098}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}.top{height:7px;background:linear-gradient(90deg,var(--blue) 0 42%,var(--orange) 42% 67%,var(--green) 67% 84%,#ffd34e 84%)}.wrap{width:min(1180px,92%);margin:auto}header{background:#fff;box-shadow:0 4px 18px #123d7812}.nav{height:78px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;color:var(--blue);font-weight:bold;text-decoration:none}.brand img{height:57px;width:57px;object-fit:contain}.back{color:var(--blue);text-decoration:none;font-weight:bold}.page{padding:35px 0}.title{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.title h1{color:var(--blue);margin:0}.title p{color:var(--muted)}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 28px #173b6c12;margin-top:20px}.login{max-width:450px;margin:45px auto}.form{display:grid;gap:11px}.form input,.form textarea,.form select{width:100%;border:1px solid #d8e1ef;border-radius:9px;padding:12px;background:#fff}.form textarea{min-height:75px}.btn{border:0;border-radius:10px;padding:11px 17px;font-weight:bold;cursor:pointer}.primary{background:var(--orange);color:#fff}.secondary{background:#eaf1ff;color:var(--blue)}.danger{background:#ffe8e5;color:#bd3529}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:25px}.tab.active{background:var(--blue);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #edf1f6}.row:last-child{border-bottom:0}.row strong{color:var(--blue)}.actions{display:flex;gap:6px;flex-wrap:wrap}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;margin-top:10px}.table th,.table td{text-align:right;padding:12px;border-bottom:1px solid #edf1f6;white-space:nowrap}.table th{background:#f4f7fc;color:var(--blue)}.thumb{width:46px;height:40px;object-fit:cover;border-radius:7px;vertical-align:middle}.notice{padding:12px;border-radius:9px;background:#fff4d8;color:#785900;margin-top:12px}.success{background:#e7f7ed;color:#257b46}.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}.status{color:#25804a;font-weight:bold}.file{font-size:13px}@media(max-width:750px){.grid{grid-template-columns:1fr}.nav{height:68px}.brand img{width:48px;height:48px}.table{font-size:13px}}
</style></head><body><div class="top"></div><header><div class="wrap nav"><a class="brand" href="index.html"><img src="assets/logo.jpg" alt="الشعار"><span>مكتبة ومطبعة<br>محمد عثمان</span></a><a class="back" href="index.html">← العودة للموقع</a></div></header><main class="wrap page"><div class="title"><div><h1>لوحة التحكم</h1><p>إدارة الأقسام والأنواع والمنتجات والصور</p></div><button id="logout" class="btn secondary hidden" onclick="logout()">تسجيل الخروج</button></div><section id="loginBox" class="card login"><h2>دخول المدير</h2><form class="form" onsubmit="login(event)"><input id="email" type="email" required placeholder="البريد الإلكتروني"><input id="password" type="password" required placeholder="كلمة المرور"><button class="btn primary">دخول</button></form><div id="loginMsg"></div></section><section id="dashboard" class="hidden"><div class="tabs"><button class="btn tab active" onclick="showTab('content',this)">الأقسام والأنواع</button><button class="btn tab" onclick="showTab('products',this)">المنتجات</button></div><div id="contentTab" class="grid"><div class="card"><div class="title"><h2>الأقسام</h2><button class="btn primary" onclick="addSection()">+ إضافة قسم</button></div><p class="muted">القسم الرئيسي مثل: المكتبة أو الأدوات المكتبية.</p><div id="sectionsList"></div></div><div class="card"><div class="title"><h2>الأنواع</h2><button class="btn primary" onclick="addType()">+ إضافة نوع</button></div><p class="muted">كل نوع يرتبط بقسم محدد.</p><div id="typesList"></div></div></div><div id="productsTab" class="card hidden"><div class="title"><div><h2>المنتجات</h2><p class="muted">كل منتج مرتبط بنوع، والنوع مرتبط بقسم.</p></div><button class="btn primary" onclick="openProductForm()">+ إضافة منتج</button></div><div id="productForm" class="hidden card"><h3 id="formTitle">إضافة منتج</h3><form class="form" onsubmit="saveProduct(event)"><input type="hidden" id="productId"><input id="productName" required placeholder="اسم المنتج"><textarea id="productDesc" placeholder="وصف المنتج"></textarea><select id="productType" required><option value="">اختر النوع</option></select><input id="productIcon" value="📦" placeholder="رمز بديل مثل 📚"><label class="file">صورة المنتج (اختياري)<input id="productImage" type="file" accept="image/*"></label><div class="actions"><button class="btn primary">حفظ المنتج</button><button type="button" class="btn secondary" onclick="closeProductForm()">إلغاء</button></div></form></div><div class="table-wrap"><table class="table"><thead><tr><th>الصورة</th><th>المنتج</th><th>القسم / النوع</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody id="productsList"></tbody></table></div></div><div id="msg"></div></section></main><script>
const db=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);let sections=[],types=[],products=[];const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function message(t,ok=false){$('msg').innerHTML=`<div class="notice ${ok?'success':''}">${t}</div>`;setTimeout(()=>$('msg').innerHTML='',3000)}
async function login(e){e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginMsg').innerHTML='<div class="notice">بيانات الدخول غير صحيحة أو لم يتم إنشاء المستخدم.</div>';return}showDashboard()}async function logout(){await db.auth.signOut();location.reload()}async function showDashboard(){$('loginBox').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');await refresh()}
function showTab(name,button){$('contentTab').classList.toggle('hidden',name!=='content');$('productsTab').classList.toggle('hidden',name!=='products');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));button.classList.add('active')}
async function refresh(){const s=await db.from('sections').select('*').order('sort_order');const t=await db.from('product_types').select('*, sections(name)').order('sort_order');const p=await db.from('products').select('*, product_types(name,section_id,sections(name))').order('id',{ascending:false});if(s.error||t.error||p.error){message('تعذر قراءة البيانات. شغّل database.sql النهائي في Supabase.');return}sections=s.data||[];types=t.data||[];products=p.data||[];renderSections();renderTypes();renderTypeOptions();renderProducts()}
function renderSections(){$('sectionsList').innerHTML=sections.length?sections.map(s=>`<div class="row"><strong>${esc(s.name)}</strong><div class="actions"><button class="btn secondary" onclick="editSection(${s.id},'${esc(s.name)}')">تعديل</button><button class="btn danger" onclick="deleteSection(${s.id})">حذف</button></div></div>`).join(''):'<p class="muted">لا توجد أقسام.</p>'}function renderTypes(){$('typesList').innerHTML=types.length?types.map(t=>`<div class="row"><div><strong>${esc(t.name)}</strong><br><span class="muted">${esc(t.sections?.name||'')}</span></div><div class="actions"><button class="btn secondary" onclick="editType(${t.id},'${esc(t.name)}',${t.section_id})">تعديل</button><button class="btn danger" onclick="deleteType(${t.id})">حذف</button></div></div>`).join(''):'<p class="muted">لا توجد أنواع.</p>'}function renderTypeOptions(){$('productType').innerHTML='<option value="">اختر النوع</option>'+types.map(t=>`<option value="${t.id}">${esc(t.sections?.name||'')} / ${esc(t.name)}</option>`).join('')}
function renderProducts(){$('productsList').innerHTML=products.length?products.map(p=>`<tr><td>${p.image_url?`<img class="thumb" src="${esc(p.image_url)}">`:(p.icon||'📦')}</td><td><strong>${esc(p.name)}</strong><br><span class="muted">${esc(p.description||'')}</span></td><td>${esc(p.product_types?.sections?.name||'-')} / ${esc(p.product_types?.name||'-')}</td><td class="status">${p.is_visible?'ظاهر':'مخفي'}</td><td><div class="actions"><button class="btn secondary" onclick="editProduct(${p.id})">تعديل</button><button class="btn secondary" onclick="toggleProduct(${p.id},${p.is_visible})">${p.is_visible?'إخفاء':'إظهار'}</button><button class="btn danger" onclick="deleteProduct(${p.id})">حذف</button></div></td></tr>`).join(''):'<tr><td colspan="5" class="muted">لا توجد منتجات.</td></tr>'}
async function addSection(){const name=prompt('اسم القسم:');if(!name)return;const {error}=await db.from('sections').insert({name});message(error?'تعذر إضافة القسم':'تمت إضافة القسم',!error);if(!error)refresh()}async function editSection(id,old){const name=prompt('اسم القسم:',old);if(!name)return;const {error}=await db.from('sections').update({name}).eq('id',id);message(error?'تعذر تعديل القسم':'تم تعديل القسم',!error);if(!error)refresh()}async function deleteSection(id){if(!confirm('حذف القسم؟ سيتم حذف الأنواع التابعة له.'))return;const {error}=await db.from('sections').delete().eq('id',id);message(error?'تعذر الحذف':'تم حذف القسم',!error);if(!error)refresh()}
async function addType(){if(!sections.length){message('أضف قسمًا أولًا');return}const section=prompt('اكتب رقم القسم:\n'+sections.map(s=>s.id+': '+s.name).join('\n'));if(!section)return;const name=prompt('اسم النوع:');if(!name)return;const {error}=await db.from('product_types').insert({section_id:Number(section),name});message(error?'تعذر إضافة النوع':'تمت إضافة النوع',!error);if(!error)refresh()}async function editType(id,old,oldSection){const name=prompt('اسم النوع:',old);if(!name)return;const section=prompt('رقم القسم:\n'+sections.map(s=>s.id+': '+s.name).join('\n'),oldSection);if(!section)return;const {error}=await db.from('product_types').update({name,section_id:Number(section)}).eq('id',id);message(error?'تعذر التعديل':'تم تعديل النوع',!error);if(!error)refresh()}async function deleteType(id){if(!confirm('حذف النوع؟'))return;const {error}=await db.from('product_types').delete().eq('id',id);message(error?'تعذر الحذف':'تم حذف النوع',!error);if(!error)refresh()}
function openProductForm(){$('productForm').classList.remove('hidden');$('formTitle').textContent='إضافة منتج';$('productId').value='';$('productName').value='';$('productDesc').value='';$('productType').value='';$('productIcon').value='📦';$('productImage').value=''}function closeProductForm(){$('productForm').classList.add('hidden')}function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;openProductForm();$('formTitle').textContent='تعديل منتج';$('productId').value=p.id;$('productName').value=p.name;$('productDesc').value=p.description||'';$('productType').value=p.type_id||'';$('productIcon').value=p.icon||'📦';window.scrollTo({top:$('productForm').offsetTop-20,behavior:'smooth'})}
async function upload(file){if(!file)return null;const ext=file.name.split('.').pop().toLowerCase();const path=crypto.randomUUID()+'.'+ext;const {error}=await db.storage.from('product-images').upload(path,file,{contentType:file.type});if(error){message('تعذر رفع الصورة. تأكد من bucket باسم product-images');return null}return db.storage.from('product-images').getPublicUrl(path).data.publicUrl}
async function saveProduct(e){e.preventDefault();const id=$('productId').value;const payload={name:$('productName').value,description:$('productDesc').value,type_id:Number($('productType').value),icon:$('productIcon').value||'📦',is_visible:true};const url=await upload($('productImage').files[0]);if(url)payload.image_url=url;const result=id?await db.from('products').update(payload).eq('id',id):await db.from('products').insert(payload);if(result.error){message('تعذر حفظ المنتج. راجع صلاحيات قاعدة البيانات.');return}message(id?'تم تعديل المنتج':'تمت إضافة المنتج',true);closeProductForm();refresh()}
async function toggleProduct(id,state){const {error}=await db.from('products').update({is_visible:!state}).eq('id',id);message(error?'تعذر تغيير الحالة':'تم تحديث الحالة',!error);if(!error)refresh()}async function deleteProduct(id){if(!confirm('حذف المنتج نهائيًا؟'))return;const {error}=await db.from('products').delete().eq('id',id);message(error?'تعذر الحذف':'تم حذف المنتج',!error);if(!error)refresh()}
db.auth.getSession().then(({data})=>data.session?showDashboard():null);
</script></body></html>
