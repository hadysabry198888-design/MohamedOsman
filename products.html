<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منتجاتنا — مكتبة ومطبعة محمد عثمان</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>
:root{--blue:#17479b;--deep:#102f6d;--orange:#f47b20;--green:#78bd3d;--yellow:#ffd34e;--bg:#f8fafc;--line:#e3e9f2;--ink:#203453;--muted:#778399}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}.top{height:7px;background:linear-gradient(90deg,var(--blue) 0 43%,var(--orange) 43% 67%,var(--green) 67% 84%,var(--yellow) 84%)}.wrap{width:min(1160px,92%);margin:auto}header{height:82px;background:#fff;border-bottom:1px solid #edf1f7;display:flex;align-items:center}.nav{display:flex;align-items:center;justify-content:space-between;gap:25px}.brand{display:flex;align-items:center;gap:10px;color:var(--blue);text-decoration:none;font-weight:800;line-height:1.3}.brand img{width:58px;height:58px;object-fit:contain}.links{display:flex;gap:27px}.links a{color:var(--ink);font-size:14px;font-weight:bold;text-decoration:none}.links a.active{color:var(--orange)}.contact{color:#fff;background:var(--orange);padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:bold}.page{padding:58px 0 80px}.heading{text-align:center;margin-bottom:35px}.heading h1{font-size:clamp(34px,5vw,54px);color:var(--deep);margin:0 0 13px}.heading h1 span{color:var(--orange)}.heading p{color:var(--muted);font-size:16px;margin:0}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:28px;flex-wrap:wrap}.filters{display:flex;gap:9px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;color:var(--blue);padding:11px 18px;border-radius:22px;font-weight:bold;cursor:pointer}.filter.active,.filter:hover{background:var(--blue);border-color:var(--blue);color:#fff}.search{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 16px;width:230px;color:var(--ink)}.catalog{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.product{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;transition:.2s;position:relative}.product:hover{transform:translateY(-5px);box-shadow:0 12px 28px #153d7314}.image{height:205px;border-radius:13px;background:linear-gradient(145deg,#f4f8fd,#eaf1fa);display:grid;place-items:center;overflow:hidden;font-size:70px}.image img{width:100%;height:100%;object-fit:cover}.product h3{font-size:17px;color:var(--deep);margin:16px 7px 7px}.product p{font-size:13px;color:var(--muted);line-height:1.7;margin:0 7px;min-height:42px}.meta{color:var(--orange);font-size:12px;margin:12px 7px 0}.details{display:block;text-align:center;background:#edf3ff;color:var(--blue);border-radius:9px;padding:11px;margin:14px 3px 2px;text-decoration:none;font-weight:bold;border:0;width:calc(100% - 6px);cursor:pointer}.details:hover{background:var(--orange);color:#fff}.section-block{grid-column:1/-1}.section-name{color:var(--deep);font-size:25px;margin:18px 0 13px;padding-right:14px;border-right:5px solid var(--orange)}.type-name{color:var(--orange);font-size:18px;margin:20px 0 12px}.type-products{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.empty{grid-column:1/-1;background:#fff;border:1px dashed #ccd7e7;border-radius:15px;text-align:center;color:var(--muted);padding:35px}.loading{grid-column:1/-1;text-align:center;color:var(--muted);padding:35px}.modal{position:fixed;inset:0;background:#102e6755;display:grid;place-items:center;padding:20px;z-index:30}.modal-card{background:#fff;border-radius:20px;padding:25px;max-width:470px;width:100%;position:relative}.modal-card img{width:100%;height:230px;object-fit:cover;border-radius:13px}.close{position:absolute;left:18px;top:15px;border:0;background:#eef3fa;color:var(--blue);border-radius:50%;width:32px;height:32px;font-size:18px}.wa{display:inline-block;background:#29b765;color:#fff;border-radius:10px;padding:12px 18px;text-decoration:none;font-weight:bold;margin-top:14px}footer{background:var(--deep);color:#dbe7ff;text-align:center;padding:25px}.admin{color:#fff;text-decoration:none;font-size:13px;display:block;margin-top:8px}@media(max-width:850px){.links{display:none}.catalog,.type-products{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.contact{padding:10px 13px}.page{padding-top:42px}.catalog,.type-products{grid-template-columns:1fr}.search{width:100%}.toolbar{display:block}.filters{margin-bottom:12px}}
</style></head><body><div class="top"></div><header><div class="wrap nav"><a class="brand" href="index.html"><img src="assets/logo.jpg" alt="الشعار"><span>مكتبة ومطبعة<br>محمد عثمان</span></a><nav class="links"><a href="index.html">الرئيسية</a><a class="active" href="products.html">المنتجات</a><a href="index.html#services">خدمات الطباعة</a><a href="index.html#contact">تواصل معنا</a></nav><a class="contact" href="https://wa.me/201098090100" target="_blank">تواصل معنا</a></div></header><main class="wrap page"><div class="heading"><h1>تصفح <span>منتجاتنا</span></h1><p>اكتشف تشكيلتنا من المنتجات المرتبة حسب القسم والنوع</p></div><div class="toolbar"><div class="filters" id="filters"><button class="filter active" data-section="all">الكل</button></div><input class="search" id="search" placeholder="ابحث عن منتج..." oninput="render()"></div><div class="catalog" id="catalog"><div class="loading">جاري تحميل المنتجات...</div></div></main><footer>© 2026 مكتبة ومطبعة محمد عثمان — للعرض والاستفسار فقط<a class="admin" href="admin.html">دخول لوحة التحكم</a></footer><div id="modal" class="modal" style="display:none" onclick="if(event.target===this)closeModal()"><div class="modal-card"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div><script>
const db=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);let products=[],active='all';const fallback=[{id:1,name:'كراسات ومذكرات',description:'منتجات متنوعة',icon:'📒',section:'المكتبة',type:'كراسات'},{id:2,name:'أقلام وأدوات كتابة',description:'للمدرسة والمكتب',icon:'✏️',section:'الأدوات المكتبية',type:'أقلام'}];function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function wa(n){window.open('https://wa.me/201098090100?text='+encodeURIComponent('مرحباً، أريد الاستفسار عن: '+n),'_blank')}function card(p){return `<article class="product"><div class="image">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:(p.icon||'📦')}</div><h3>${esc(p.name)}</h3><p>${esc(p.description||'منتج من مكتبة ومطبعة محمد عثمان')}</p><div class="meta">${esc(p.section||'')} / ${esc(p.type||'')}</div><button class="details" onclick="openDetails(${p.id})">عرض التفاصيل</button></article>`}function render(){const q=document.getElementById('search').value.trim().toLowerCase();let list=products.filter(p=>(active==='all'||p.section===active)&&(!q||(`${p.name} ${p.description} ${p.type} ${p.section}`).toLowerCase().includes(q)));const groups={};list.forEach(p=>{groups[p.section]??={};groups[p.section][p.type]??=[];groups[p.section][p.type].push(p)});document.getElementById('catalog').innerHTML=Object.keys(groups).length?Object.entries(groups).map(([s,types])=>`<section class="section-block"><h2 class="section-name">${esc(s)}</h2>${Object.entries(types).map(([t,items])=>`<h3 class="type-name">${esc(t)}</h3><div class="type-products">${items.map(card).join('')}</div>`).join('')}</section>`).join(''):'<div class="empty">لا توجد منتجات مطابقة للبحث.</div>'}function setFilter(s){active=s;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.section===s));render()}function openDetails(id){const p=products.find(x=>x.id===id);if(!p)return;document.getElementById('modalBody').innerHTML=`${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:''}<h2 style="color:var(--deep)">${esc(p.name)}</h2><p style="color:var(--muted);line-height:1.8">${esc(p.description||'منتج من مكتبة ومطبعة محمد عثمان')}</p><p class="meta">القسم: ${esc(p.section)} — النوع: ${esc(p.type)}</p><a class="wa" href="https://wa.me/201098090100?text=${encodeURIComponent('مرحباً، أريد الاستفسار عن: '+p.name)}" target="_blank">استفسر عبر واتساب</a>`;document.getElementById('modal').style.display='grid'}function closeModal(){document.getElementById('modal').style.display='none'}async function load(){const {data,error}=await db.from('products').select('*, product_types(name, sections(name))').eq('is_visible',true).order('sort_order');if(error||!data?.length){products=fallback}else{products=data.map(p=>({...p,section:p.product_types?.sections?.name||'منتجات عامة',type:p.product_types?.name||'بدون نوع'}))}const sections=[...new Set(products.map(p=>p.section))];document.getElementById('filters').innerHTML='<button class="filter active" data-section="all" onclick="setFilter(\'all\')">الكل</button>'+sections.map(s=>`<button class="filter" data-section="${esc(s)}" onclick="setFilter('${esc(s)}')">${esc(s)}</button>`).join('');render()}load();
</script></body></html>
